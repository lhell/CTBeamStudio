[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-viewer"
version = "1.0.0"
description = "A web-based visualization tool for CT orientation and 3D volume rendering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CT-Viewer Project", email = "contact@example.com"}
]
keywords = ["ct", "medical-imaging", "dicom", "visualization", "3d"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "pydicom>=3.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "streamlit>=1.28.0,<1.40.0",
    "streamlit-image-coordinates>=0.0.6",
    "plotly>=5.18.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "array-api-compat>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
]
# NOTE: parallelproj MUST be installed via conda-forge, NOT pip!
# See: docs/superpowers/specs/2026-10-30-forward-projection-spec.md
# For CI: use mamba/conda to install parallelproj from conda-forge

[project.urls]
Homepage = "https://github.com/your-org/CTOrientationViewer"
Repository = "https://github.com/your-org/CTOrientationViewer"
Issues = "https://github.com/your-org/CTOrientationViewer/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*", "visualization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pythonpath removed - handled by conftest.py

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
    "F541",  # f-string without formatted
    "F824",  #
    "F401",  # imported but unused
    "F841",  # local variable assigned but never used (placeholders)
    "W503",  # line break before binary operator
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

