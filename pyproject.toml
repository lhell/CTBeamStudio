[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-viewer"
version = "1.0.0"
description = "A web-based visualization tool for CT orientation and 3D volume rendering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CT-Viewer Project", email = "contact@example.com"}
]
keywords = ["ct", "medical-imaging", "dicom", "visualization", "3d"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "pydicom>=3.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.28.0",
    "pyvista>=0.42.0",
    "vtk>=9.3.0",
    "plotly>=5.18.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/your-org/CTOrientationViewer"
Repository = "https://github.com/your-org/CTOrientationViewer"
Issues = "https://github.com/your-org/CTOrientationViewer/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["visualization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
