name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data-guard:
    name: Data Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for data files
        run: |
          # Check for common data file extensions
          FOUND_FILES=$(find . -type f \( -name "*.dcm" -o -name "*.ima" -o -name "*.npy" -o -name "*.npz" -o -name "*.ckpt" \) 2>/dev/null)
          
          if [ -n "$FOUND_FILES" ]; then
            echo "ERROR: Data files found in repository:"
            echo "$FOUND_FILES"
            exit 1
          fi
          
          echo "Data guard: No data files tracked"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flake8 black isort
      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run black
        run: |
          black --check .
      - name: Run isort
        run: |
          isort --check-only .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run pytest
        run: |
          pytest tests/ -v
